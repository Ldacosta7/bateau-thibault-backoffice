<nav class="navbar" [class.scrolled]="isScrolled">

  <div class="wave-bg" aria-hidden="true">
    <div class="wave wave-a"></div>
    <div class="wave wave-b"></div>
  </div>

  <div class="nav-inner">

    <a class="brand" routerLink="/produits">
      <div class="brand-mark">
        <svg width="19" height="19" viewBox="0 0 64 64" fill="none">
          <path d="M50 32C50 32 38 16 20 20C14 21.5 8 26 8 32C8 38 14 42.5 20 44C38 48 50 32 50 32Z" fill="white"/>
          <path d="M50 32C46 28 56 20 60 24C62 26 62 30 60 34C56 38 46 36 50 32Z" fill="white"/>
          <circle cx="22" cy="28" r="2.5" fill="rgba(5,30,51,0.45)"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">Bateau de Thibault</span>
        <span class="brand-sub">Poissonnerie & Fruits de mer</span>
      </div>
    </a>

    <div class="nav-links">
      <a class="nav-link" routerLink="/produits"   routerLinkActive="nav-link--active">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        Produits
      </a>
      <a class="nav-link" routerLink="/historique" routerLinkActive="nav-link--active">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        Historique
      </a>
      <a class="nav-link" routerLink="/dashboard"  routerLinkActive="nav-link--active">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>
    </div>

    <div class="nav-right">
      <button class="logout-btn" (click)="logout()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Déconnexion
      </button>

      <button class="burger" (click)="toggleMenu()" [class.is-open]="menuOpen">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

  </div>

  <div class="accent-line"></div>

  <div class="mobile-drawer" [class.is-open]="menuOpen">
    <a class="mobile-link" routerLink="/produits"   routerLinkActive="mobile-active" (click)="closeMenu()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
      Produits
    </a>
    <a class="mobile-link" routerLink="/historique" routerLinkActive="mobile-active" (click)="closeMenu()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      Historique
    </a>
    <a class="mobile-link" routerLink="/dashboard"  routerLinkActive="mobile-active" (click)="closeMenu()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Dashboard
    </a>
    <div class="mobile-divider"></div>
    <button class="mobile-logout" (click)="logout()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Déconnexion
    </button>
  </div>

</nav>

<div class="nav-backdrop" [class.is-visible]="menuOpen" (click)="closeMenu()"></div>
